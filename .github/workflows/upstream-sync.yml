name: Sync Fork With Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/WenyuChiou/awesome-agentic-ai-zh.git || true
          git fetch upstream main

      - name: Mirror upstream tree except workflow files
        run: |
          git checkout main
          git restore --source=upstream/main --worktree --staged .
          if [ -d .github/workflows ]; then
            git restore --source=HEAD --worktree --staged .github/workflows || true
          fi

      - name: Commit synced changes
        run: |
          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            exit 0
          fi
          git commit -m "chore: sync upstream content"

      - name: Push updated fork
        run: git push origin main
