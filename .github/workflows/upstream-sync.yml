name: Sync Fork With Upstream

env:
  UPSTREAM_REPO: https://github.com/WenyuChiou/awesome-agentic-ai-zh.git
  UPSTREAM_REF: main

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream "$UPSTREAM_REPO" || true
          git fetch upstream "$UPSTREAM_REF"
          echo "Current fork HEAD: $(git rev-parse HEAD)"
          echo "Upstream $UPSTREAM_REF HEAD: $(git rev-parse upstream/$UPSTREAM_REF)"

      - name: List fork GitHub config to preserve
        run: |
          if [ -d .github ]; then
            echo "Preserving fork .github directory contents:"
            find .github -maxdepth 3 | sort
          else
            echo "No .github directory exists in fork."
          fi

      - name: Mirror upstream tree except fork GitHub config
        run: |
          git checkout main
          git restore --source="upstream/$UPSTREAM_REF" --worktree --staged .
          if [ -d .github ]; then
            git restore --source=HEAD --worktree --staged .github || true
          fi

      - name: Show staged sync summary
        run: |
          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            exit 0
          fi
          echo "Staged change summary:"
          git diff --cached --stat
          echo
          echo "First 200 changed paths:"
          git diff --cached --name-status | sed -n '1,200p'

      - name: Commit synced changes
        run: |
          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            exit 0
          fi
          git commit -m "chore: sync upstream content"

      - name: Push updated fork
        run: |
          git push origin main
          echo "Fork sync push completed successfully."
