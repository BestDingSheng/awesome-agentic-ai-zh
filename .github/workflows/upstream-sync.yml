name: Sync Fork With Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/WenyuChiou/awesome-agentic-ai-zh.git || true
          git fetch upstream main
          echo "Current fork HEAD: $(git rev-parse HEAD)"
          echo "Upstream main HEAD: $(git rev-parse upstream/main)"

      - name: List fork workflow files to preserve
        run: |
          if [ -d .github/workflows ]; then
            echo "Preserving fork workflow directory contents:"
            find .github/workflows -maxdepth 1 -type f | sort
          else
            echo "No .github/workflows directory exists in fork."
          fi

      - name: Mirror upstream tree except workflow files
        run: |
          git checkout main
          git restore --source=upstream/main --worktree --staged .
          if [ -d .github/workflows ]; then
            git restore --source=HEAD --worktree --staged .github/workflows || true
          fi

      - name: Show staged sync summary
        run: |
          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            exit 0
          fi
          echo "Staged change summary:"
          git diff --cached --stat
          echo
          echo "First 200 changed paths:"
          git diff --cached --name-status | sed -n '1,200p'

      - name: Commit synced changes
        run: |
          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            exit 0
          fi
          git commit -m "chore: sync upstream content"

      - name: Push updated fork
        run: |
          git push origin main
          echo "Fork sync push completed successfully."
